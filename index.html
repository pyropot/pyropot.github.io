<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>7-Card Stud Multiplayer</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1517;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    header { text-align: center; margin-bottom: 8px; }
    h1 { font-size: 1.7rem; color: #f1c40f; }

    /* Lobby Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .lobby-card {
      background: #162428;
      border: 2px solid #f1c40f;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .lobby-card input, .lobby-card select, .lobby-card button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3b535d;
      background: #243b44;
      color: #fff;
      font-size: 1rem;
    }
    .lobby-card button {
      background: #2ecc71;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    /* Table & HUD */
    .table {
      position: relative;
      width: 96vw;
      max-width: 1000px;
      height: 580px;
      background: radial-gradient(circle, #27ae60 0%, #196f3d 75%, #0d381e 100%);
      border: 14px solid #4a2d16;
      border-radius: 220px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
    }
    .center-hud { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 5; }
    .pot-display {
      text-align: center; background: rgba(0,0,0,0.65); padding: 6px 18px; border-radius: 14px;
    }
    .pot-amount { font-size: 1.4rem; color: #f1c40f; font-weight: bold; }

    /* Compact Wild Cards */
    .wild-window {
      background: rgba(18, 30, 36, 0.92); border: 2px solid #f39c12; border-radius: 10px;
      padding: 4px 10px; text-align: center;
    }
    .compact-wild-card {
      background: #fff; color: #111; border-radius: 4px; padding: 2px 6px;
      display: inline-flex; flex-direction: column; align-items: center; font-weight: bold;
    }
    .compact-wild-suits { font-size: 0.7rem; display: flex; gap: 2px; }
    .suit-b { color: #111; } .suit-r { color: #e74c3c; }

    /* Player Seats */
    .player-seat {
      position: absolute; background: rgba(15, 25, 30, 0.9); border-radius: 10px;
      padding: 8px 12px; min-width: 170px; border: 2px solid transparent;
    }
    .player-seat.active-turn { border-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
    .player-seat.folded { opacity: 0.35; }
    #seat-0 { bottom: 12px; left: 50%; transform: translateX(-50%); }
    #seat-1 { left: 15px; top: 44%; transform: translateY(-50%); }
    #seat-2 { top: 12px; left: 50%; transform: translateX(-50%); }
    #seat-3 { right: 15px; top: 44%; transform: translateY(-50%); }

    .cards-row { display: flex; gap: 4px; margin-top: 4px; min-height: 46px; }
    .card {
      width: 32px; height: 46px; background: #fff; border-radius: 4px; color: #111;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: bold; position: relative;
    }
    .card.red { color: #e74c3c; }
    .card.back { background: repeating-linear-gradient(45deg, #2c3e50, #2c3e50 5px, #34495e 5px, #34495e 10px); color: transparent; }
    .card.is-wild::after { content: '★'; position: absolute; top: -5px; right: -2px; color: #e67e22; }

    /* Controls */
    .control-dock {
      display: flex; gap: 10px; background: #162428; padding: 10px 18px; border-radius: 10px; align-items: center;
    }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-fold { background: #e74c3c; color: #fff; }
    .btn-check { background: #3498db; color: #fff; }
    .btn-raise { background: #2ecc71; color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Log */
    .game-log {
      width: 96vw; max-width: 1000px; background: #101c1f; border-radius: 8px;
      padding: 6px 12px; height: 60px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; color: #aaa; margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Lobby Screen Modal -->
  <div class="modal-overlay" id="lobbyModal">
    <div class="lobby-card">
      <h2 style="color:#f1c40f; text-align:center;">Multiplayer Stud</h2>
      <input type="text" id="playerNameInput" placeholder="Your Name" value="Player">
      <input type="text" id="roomIdInput" placeholder="Room Code (e.g. room1)" value="room1">
      <select id="ruleVariantInput">
        <option value="standard">Standard Rules</option>
        <option value="deuces">Deuces Wild (2s Wild)</option>
        <option value="follow">Follow the Queen</option>
      </select>
      <button onclick="joinRoom()">Join / Create Room</button>
    </div>
  </div>

  <header>
    <h1>7-Card Stud Multiplayer</h1>
  </header>

  <!-- Table View -->
  <div class="table">
    <div class="center-hud">
      <div class="pot-display">
        <div class="pot-amount" id="potText">$0</div>
        <div style="font-size:0.75rem; color:#00d2d3;" id="streetText">Waiting to Start</div>
      </div>
      <div class="wild-window">
        <div style="font-size:0.65rem; color:#f1c40f; font-weight:bold;">WILD CARDS</div>
        <div id="wildCardsList" style="display:flex; gap:6px; justify-content:center;">None</div>
      </div>
      <button id="startHandBtn" onclick="startHand()" style="padding:6px 12px; background:#f1c40f; color:#000; font-weight:bold; border:none; border-radius:6px; cursor:pointer;">Start Hand (+Bots)</button>
    </div>

    <!-- 4 Player Seats -->
    <div class="player-seat" id="seat-0"><div class="player-name" id="name-0">Empty</div><div id="chips-0">$0</div><div id="status-0" style="font-size:0.75rem; color:#f39c12;"></div><div class="cards-row" id="cards-0"></div></div>
    <div class="player-seat" id="seat-1"><div class="player-name" id="name-1">Empty</div><div id="chips-1">$0</div><div id="status-1" style="font-size:0.75rem; color:#f39c12;"></div><div class="cards-row" id="cards-1"></div></div>
    <div class="player-seat" id="seat-2"><div class="player-name" id="name-2">Empty</div><div id="chips-2">$0</div><div id="status-2" style="font-size:0.75rem; color:#f39c12;"></div><div class="cards-row" id="cards-2"></div></div>
    <div class="player-seat" id="seat-3"><div class="player-name" id="name-3">Empty</div><div id="chips-3">$0</div><div id="status-3" style="font-size:0.75rem; color:#f39c12;"></div><div class="cards-row" id="cards-3"></div></div>
  </div>

  <!-- Actions -->
  <div class="control-dock">
    <button class="btn btn-fold" id="btnFold" onclick="sendAction('fold')" disabled>Fold</button>
    <button class="btn btn-check" id="btnCheck" onclick="sendAction('check')" disabled>Check</button>
    <button class="btn btn-raise" id="btnRaise" onclick="sendAction('raise')" disabled>Bet $2</button>
  </div>

  <div class="game-log" id="gameLog"><p>Connecting...</p></div>

<script>
  const SERVER_URL = "https://pyropot-github-io.onrender.com/"; 

  const socket = io(SERVER_URL);
  let currentRoomId = '';
  let myPlayerName = '';

  function log(msg) {
    const logBox = document.getElementById('gameLog');
    const p = document.createElement('p');
    p.innerHTML = msg;
    logBox.prepend(p);
  }

  function joinRoom() {
    myPlayerName = document.getElementById('playerNameInput').value || 'Hero';
    currentRoomId = document.getElementById('roomIdInput').value || 'room1';
    const rule = document.getElementById('ruleVariantInput').value;

    socket.emit('join_room', { roomId: currentRoomId, playerName: myPlayerName, ruleVariant: rule });
    document.getElementById('lobbyModal').style.display = 'none';
    log(`Joined Room: <b>${currentRoomId}</b> as <b>${myPlayerName}</b>`);
  }

  function startHand() {
    socket.emit('start_hand', { roomId: currentRoomId, fillBots: true });
  }

  function sendAction(action) {
    socket.emit('take_action', { roomId: currentRoomId, action, raiseAmt: 4 });
  }

  socket.on('prompt_river_choice', () => {
    const choice = confirm("7th Street: Click OK for Face-Up 👁️, or Cancel for Face-Down 🔒");
    socket.emit('river_choice', { roomId: currentRoomId, faceUp: choice });
  });

  socket.on('game_state', (state) => {
    document.getElementById('potText').innerText = `$${state.pot}`;
    
    // Update Wilds Window
    const wildList = document.getElementById('wildCardsList');
    wildList.innerHTML = '';
    let wildRanks = [];
    if (state.ruleVariant === 'deuces') wildRanks = ['2'];
    if (state.ruleVariant === 'follow') {
      wildRanks.push('Q');
      if (state.followRank) wildRanks.push(state.followRank);
    }
    if (wildRanks.length === 0) wildList.innerText = 'None';
    else {
      wildRanks.forEach(r => {
        const c = document.createElement('div');
        c.className = 'compact-wild-card';
        c.innerHTML = `<div>${r}</div><div class="compact-wild-suits"><span class="suit-b">♠</span><span class="suit-r">♥</span><span class="suit-r">♦</span><span class="suit-b">♣</span></div>`;
        wildList.appendChild(c);
      });
    }

    // Render Players
    state.players.forEach((p, idx) => {
      document.getElementById(`name-${idx}`).innerText = p.name;
      document.getElementById(`chips-${idx}`).innerText = `$${p.chips}`;
      document.getElementById(`status-${idx}`).innerText = p.handDesc || (p.folded ? 'Folded' : '');
      
      const seat = document.getElementById(`seat-${idx}`);
      if (idx === state.activeTurnIndex) seat.classList.add('active-turn');
      else seat.classList.remove('active-turn');

      const cardBox = document.getElementById(`cards-${idx}`);
      cardBox.innerHTML = '';
      p.cards.forEach(card => {
        const el = document.createElement('div');
        if (card.rank) {
          const isRed = card.suit === '♥' || card.suit === '♦';
          const wild = (state.ruleVariant === 'deuces' && card.rank === '2') || (state.ruleVariant === 'follow' && (card.rank === 'Q' || card.rank === state.followRank));
          el.className = `card ${isRed ? 'red' : ''} ${wild ? 'is-wild' : ''}`;
          el.innerHTML = `<span>${card.rank}</span><span>${card.suit}</span>`;
        } else {
          el.className = 'card back';
        }
        cardBox.appendChild(el);
      });
    });

    // Toggle Buttons if it's my turn
    const activePlayer = state.players[state.activeTurnIndex];
    const isMyTurn = activePlayer && activePlayer.id === socket.id && !activePlayer.folded;

    document.getElementById('btnFold').disabled = !isMyTurn;
    document.getElementById('btnCheck').disabled = !isMyTurn;
    document.getElementById('btnRaise').disabled = !isMyTurn;

    if (state.message) log(state.message);
  });
</script>

</body>
</html>
