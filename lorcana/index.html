<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lorelight Duel · Pyropot Lab</title><style>:root{--ink:#0b1430;--gold:#ffd56a;--mist:#b5d8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:25px;background:radial-gradient(circle at 50% 15%,#58439a,#12183d 56%,#080d22);font-family:system-ui;color:#f6f4ff}.app{width:min(900px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#d6e7ff;text-decoration:none}.tag{color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:bold}.board{margin-top:25px;padding:clamp(18px,4vw,38px);background:#101a3ed9;border:1px solid #ffffff2e;border-radius:24px;box-shadow:0 25px 70px #0008}.scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:16px}.score{font-size:clamp(3rem,9vw,6rem);font-weight:900;letter-spacing:-.08em;color:var(--gold)}.name{color:#b8c7e8}.vs{font-weight:900;color:#e2e9ff}.scene{padding:30px 0 18px;text-align:center;color:#c5d4ed;min-height:80px}.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{min-height:170px;padding:17px;border-radius:16px;border:1px solid #ffffff31;text-align:left;color:white;background:linear-gradient(140deg,#3d6ab0,#212457);cursor:pointer;transition:.2s}.card:hover{transform:translateY(-5px);border-color:var(--gold)}.card:nth-child(2){background:linear-gradient(140deg,#a65387,#312057)}.card:nth-child(3){background:linear-gradient(140deg,#287e72,#15364a)}.card small{color:#e5efff}.card strong{display:block;font-size:1.25rem;margin:12px 0}.actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 16px;background:var(--gold);color:#352500;font-weight:850;cursor:pointer}button.alt{background:#ffffff15;color:white;border:1px solid #ffffff35}@media(max-width:600px){.hand{grid-template-columns:1fr}.card{min-height:115px}.board{padding:20px}.score{font-size:3.5rem}}</style></head><body><main class="app"><div class="top"><a href="/">← Pyropot Lab</a><span class="tag">Original lore-race prototype</span></div><section class="board"><div class="scores"><div><div class="name">You</div><div class="score" id="you">0</div></div><div class="vs">LORE<br>RACE</div><div><div class="name">Wandering rival</div><div class="score" id="rival">0</div></div></div><p class="scene" id="scene">Choose a character to send on a quest. Reach 20 lore first.</p><div class="hand" id="hand"></div><div class="actions"><button onclick="nextTurn()">End turn</button><button class="alt" onclick="reset()">New journey</button></div></section></main><script>const cards=[['Moonlit Scout',2,'Find a hidden path.'],['Songweaver',3,'Turn a melody into momentum.'],['Tideglass Guardian',1,'Keep watch over the crossing.']];let you=0,rival=0,played=false;function render(){document.getElementById('you').textContent=you;document.getElementById('rival').textContent=rival;document.getElementById('hand').innerHTML=cards.map((c,i)=>`<button class="card" onclick="quest(${i})" ${played?'disabled':''}><small>Quest value ${c[1]}</small><strong>${c[0]}</strong><span>${c[2]}</span></button>`).join('')}function quest(i){if(played)return;you+=cards[i][1];played=true;document.getElementById('scene').textContent=`${cards[i][0]} returns with ${cards[i][1]} lore. End your turn.`;check();render()}function nextTurn(){if(!played){document.getElementById('scene').textContent='Choose a character before ending your turn.';return}let gain=1+Math.floor(Math.random()*3);rival+=gain;played=false;document.getElementById('scene').textContent=`Your rival gathers ${gain} lore. Your turn.`;check();render()}function check(){if(you>=20||rival>=20){played=true;document.getElementById('scene').textContent=you>=20?'You completed the tale! Start a new journey to play again.':'The rival finished first. Start a new journey for a rematch.'}}function reset(){you=rival=0;played=false;document.getElementById('scene').textContent='Choose a character to send on a quest. Reach 20 lore first.';render()}reset()</script></body></html>
