<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duel Lab · Pyropot Lab</title><style>:root{--hot:#ff6a49;--blue:#76d4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 5%,#274e83,#101326 58%,#05060d);font-family:system-ui;color:#f5f7ff}.app{width:min(920px,100%);padding:clamp(20px,5vw,48px);border:1px solid #ffffff27;border-radius:26px;background:#111934d9;box-shadow:0 28px 80px #0009}.top{display:flex;justify-content:space-between}.top a{color:#b9ddff;text-decoration:none}.tag{color:var(--hot);font-size:.72rem;font-weight:bold;letter-spacing:.13em;text-transform:uppercase}.players{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0}.player{padding:22px;border:1px solid #ffffff25;border-radius:18px;text-align:center;background:#ffffff09}.player h2{margin:0;color:#c6d9fc}.lp{font-size:clamp(3rem,9vw,6.5rem);letter-spacing:-.09em;font-weight:950;margin:12px 0;color:var(--blue)}.player:last-child .lp{color:var(--hot)}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{min-width:54px;padding:10px;border-radius:9px;border:1px solid #ffffff2b;background:#ffffff12;color:white;font-weight:bold;cursor:pointer}.turn{padding:18px;border-radius:14px;background:#07101f;border:1px solid #ffffff1f;text-align:center}.turn strong{display:block;font-size:1.4rem;margin-top:5px}button.main{background:var(--hot);border:0}button.reset{background:#ffffff0e}@media(max-width:560px){.players{grid-template-columns:1fr;gap:10px;margin:20px 0}.player{padding:14px}.lp{margin:5px 0}}</style></head><body><main class="app"><div class="top"><a href="/">← Pyropot Lab</a><span class="tag">Casual duel utility</span></div><div class="players"><section class="player"><h2>Player One</h2><div class="lp" id="p1">8000</div><div class="controls"><button onclick="change(1,-100)">−100</button><button onclick="change(1,-500)">−500</button><button onclick="change(1,500)">+500</button><button onclick="change(1,100)">+100</button></div></section><section class="player"><h2>Player Two</h2><div class="lp" id="p2">8000</div><div class="controls"><button onclick="change(2,-100)">−100</button><button onclick="change(2,-500)">−500</button><button onclick="change(2,500)">+500</button><button onclick="change(2,100)">+100</button></div></section></div><div class="turn"><span class="tag">Turn tracker</span><strong id="turn">Player One · Turn 1</strong><div class="controls" style="margin-top:13px"><button class="main" onclick="nextTurn()">Next turn</button><button class="reset" onclick="reset()">Reset duel</button></div></div></main><script>let p1=8000,p2=8000,turn=1,player=1;function change(p,v){if(p===1)p1=Math.max(0,p1+v);else p2=Math.max(0,p2+v);render()}function nextTurn(){player=player===1?2:1;if(player===1)turn++;render()}function reset(){p1=p2=8000;turn=1;player=1;render()}function render(){document.getElementById('p1').textContent=p1;document.getElementById('p2').textContent=p2;document.getElementById('turn').textContent=`Player ${player} · Turn ${turn}`;if(p1===0||p2===0)document.getElementById('turn').textContent=`Player ${p1===0?2:1} wins! Reset to duel again.`}render()</script></body></html>
